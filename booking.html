<!DOCTYPE html>
<html>

<head>

    <title>Booking | Eventify</title>
    <link rel="stylesheet" href="style3.css">

    <style>


        h1 {
            text-align: center;
            font-size: 40px;
            color: rgb(154, 99, 209);
        }

        h3 {
            color: rgb(154, 99, 209);
            border-bottom: 1px solid rgb(154, 99, 209);
            padding-bottom: 8px;
        }

        .form-box {
            width: 450px;
            margin: 30px auto;
            padding: 30px;
            background-color: rgb(33, 21, 46);
            border: 2px solid rgb(154, 99, 209);
            border-radius: 10px;
        }

        .form-box p {
            margin-bottom: 5px;
            font-size: 18px;
        }

        .form-box input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
        }

        .form-box select {
            width: 422px;
            padding: 10px;
            font-size: 16px;
        }

        .form-box .btn {
            display: block;
            width: 150px;
            margin: 30px auto 0 auto;
            padding: 12px;
            background-color: rgb(154, 99, 209);
            color: white;
            border: none;
            font-size: 18px;
        }

    </style>

</head>

<body>

    <div class="top">

        <a href="index.html" class="logo">
            Event<span>ify</span>
        </a>

        <div class="links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
   
        </div>

    </div>

    <h1>Book Your Tickets</h1>

    <div class="form-box">

        <form action="index.html">

            <h3>Event Details</h3>

            <p>Select Event</p>
            <select name="event">
                <option>Comedy - Still Alive (12 Oct)</option>
                <option>Music - Diwari (31 Oct)</option>
                <option>Talk Show - Lavari (2 Nov)</option>
                <option>Comedy (15 Nov)</option>
                <option>Music - Arijit Singh (29 Oct)</option>
                <option>Music - Shreya (23 Oct)</option>
            </select>

            <p>Number of Tickets</p>
            <input type="number" name="tickets" min="1" max="10" required>

            <h3>Personal Details</h3>

            <p>Full Name</p>
            <input type="text" name="name" required>

            <p>Email</p>
            <input type="email" name="email" required>

            <p>Address</p>
            <textarea name="address" rows="4" cols="50" required></textarea>

            <p>Aadhar Card Number</p>
            <input type="text" name="aadhar" maxlength="12" required>

            <h3>Payment Details</h3>

            <p>Name on Card</p>
            <input type="text" name="cardname" required>

            <p>Card Number</p>
            <input type="text" name="cardnumber" maxlength="16" required>

            <p>Expiry Date (MM/YY)</p>
            <input type="text" name="expiry" maxlength="5" required>

            <p>CVV</p>
            <input type="password" name="cvv" maxlength="3" required>

            <input type="submit" value="Confirm Booking" class="btn">

        </form>

    </div>

</body>

</html>
