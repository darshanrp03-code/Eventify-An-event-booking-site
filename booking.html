<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Comedy | Eventify</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <nav>

        <a href="index.html" class="logo">
            Event<span>ify</span>
        </a>

        <div class="NavigationButtons">

            <a href="index.html" class="homeButton">Home</a>
            <a href="events.html" class="eventsButton">Events</a>
            <a href="about.html" class="aboutButton">About</a>
            <a href="contact.html" class="contactButton">Contact Us</a>

        </div>

    </nav>
    <h3 class="bookingtitle">Please fill the below form to complete <span> booking</span></h3>
    <div class="bookingform" id="bookingform">
    <form id="bookingform">
     <fieldset>
        <legend>Booking Details</legend>
        <table>
            <tr>
                <td><label for="lblFname">First Name:</label></td>
                <td><input type="text" id="Fname" name="name" required size="20" placeholder="Enter First Name"></td>
            </tr>
            <tr>
                <td><label for="lblLname">Last Name:</label></td>
                <td><input type="text" id="Lname" name="name" required size="20" placeholder="Enter Last Name"></td>
            </tr>
            <tr>
                <td ><label>Address:</label></td>
                <td ><textarea name="address" rows="4" cols="10" placeholder="Enter Address"></textarea></td>
            </tr>
            <tr>
                <td><label>Email:</label></td>
                <td><input type="email" name="email" required size="20" placeholder="Enter Email"></td>
            </tr>
            <tr>
                <td><label>Venue:</label></td>
                <td><input list="venue" class="Venuelist" placeholder="Select Venue"></td>
                <datalist id="venue">
                <option value="Mumbai"></option>
                <option value="Delhi"></option>
                <option value="Ahmedabad"></option>
                <option value="Udaipur"></option>
                <option value="Hyderabad"></option>
                <option value="Banglore"></option>
                </datalist>
            </tr>

          

        </table>
     </fieldset>
</div>

</body>
</html>
